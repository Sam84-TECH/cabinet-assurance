# Blueprint de déploiement Render — backend FastAPI (Cabinet Assurance).
#
# Architecture cible : ce service web sur Render, base PostgreSQL sur Neon (externe),
# frontend sur GitHub Pages (dépôt séparé).
#
# Les secrets (DATABASE_URL, CORS_ORIGINS) sont déclarés « sync: false » : Render NE lit
# PAS leur valeur ici, il la demande dans le dashboard. Aucune valeur secrète n'est donc
# jamais commitée. JWT_SECRET_KEY est généré automatiquement par Render (valeur forte,
# stable entre les redéploiements).
#
# Migrations : NON automatisées ici (voir les notes de préparation). Lancer une fois
# `alembic upgrade head` puis `python seed.py` avec DATABASE_URL pointant sur Neon.

services:
  - type: web
    name: cabinet-assurance-api
    runtime: python
    plan: free
    region: frankfurt            # au plus proche du Maroc ; à adapter à la région Neon
    branch: main
    healthCheckPath: /           # l'endpoint racine renvoie 200 ({"statut": "API opérationnelle"})
    buildCommand: pip install -r requirements.txt
    # Render fournit le port via $PORT (jamais 8000 en dur).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # --- Secrets : à saisir dans le dashboard Render, jamais ici ---
      - key: DATABASE_URL
        sync: false             # chaîne de connexion Neon (préfixe postgresql+psycopg://, sslmode=require)
      - key: CORS_ORIGINS
        sync: false             # ex. https://tonpseudo.github.io (URL du frontend GitHub Pages)
      - key: JWT_SECRET_KEY
        generateValue: true     # Render génère une clé aléatoire forte, une seule fois

      # --- Version de l'interpréteur (alignée sur le dev local) ---
      - key: PYTHON_VERSION
        value: "3.11.9"

      # --- Paramétrage métier (non secret) : valeurs de référence, alignées sur .env.example ---
      - key: TAUX_TAXE_ASSURANCE
        value: "14.00"          # taxe assurance (%) appliquée à la prime nette
      - key: DROIT_TIMBRE
        value: "0.00"           # droit de timbre fixe par quittance
      - key: DELAI_RECOUVREMENT_JOURS
        value: "30"             # bascule auto en recouvrement au-delà de ce délai
      - key: NOM_CABINET
        value: "Cabinet d'assurance - Agent général Sanlam"
      - key: SOUS_TITRE_CABINET
        value: "Sanlam Maroc - Branche Automobile"
